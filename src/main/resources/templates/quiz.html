<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{layout :: layout(~{::section}, 'Quiz')}">
<section class="quiz-layout">
    <div class="quiz-top">
        <div>
            <span class="eyebrow" th:text="${quizSession.subject.label()}">Matière</span>
            <h1>Question en cours</h1>
            <p>
                Question <span th:text="${quizSession.index + 1}">1</span> /
                <span th:text="${quizSession.total()}">7</span>
                <span class="separator">•</span>
                Score: <span th:text="${quizSession.score}">0</span>
            </p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/quiz(reset=1)}">Recommencer</a>
    </div>

    <div class="question-card">
        <div class="question-header">
            <span class="subject-chip" th:text="${question.subject.label()}">Matière</span>
            <h2 th:text="${question.statement}">Question</h2>
        </div>

        <form th:action="@{/quiz}" th:object="${answerForm}" method="post">
            <div class="choices-list">
                <div class="choice" th:each="c,iter : ${question.choices}">
                    <label class="choice-label">
                        <input class="form-check-input"
                               type="radio"
                               th:field="*{answer}"
                               th:value="${#strings.arraySplit('A,B,C,D', ',')[iter.index]}">
                        <span class="choice-letter"
                              th:text="${#strings.arraySplit('A,B,C,D', ',')[iter.index]}">A</span>
                        <span th:text="${c}">Choix</span>
                    </label>
                </div>
            </div>

            <div class="text-danger small mt-2"
                 th:if="${#fields.hasErrors('answer')}"
                 th:errors="*{answer}">Erreur</div>

            <div class="action-row">
                <button class="btn btn-primary btn-lg px-4" type="submit">Valider</button>
                <a class="btn btn-light btn-lg px-4" th:href="@{/}">Accueil</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
