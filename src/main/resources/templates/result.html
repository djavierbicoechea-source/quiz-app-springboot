<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body th:replace="~{layout :: layout(~{::section}, 'Résultat')}">
<section class="result-layout">
    <div class="result-card">
        <div class="result-left">
            <span class="eyebrow">Résultat final</span>
            <h1 th:text="${message}">Très bien</h1>
            <p>Matière: <strong th:text="${quizSession.subject.label()}">Mixte</strong></p>
        </div>

        <div class="result-right">
            <div class="score-box">
                <span class="score-number" th:text="${quizSession.score}">0</span>
                <span class="score-divider">/</span>
                <span th:text="${quizSession.total()}">7</span>
            </div>
            <div class="result-actions">
                <a class="btn btn-primary btn-lg px-4" th:href="@{/}">Rejouer</a>
                <a class="btn btn-outline-secondary btn-lg px-4" th:href="@{/quiz(reset=1)}">Nouveau quiz</a>
            </div>
        </div>
    </div>
</section>
</body>
</html>
